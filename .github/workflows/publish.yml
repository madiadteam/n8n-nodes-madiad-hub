# Publishes the package to npm with a provenance statement.
#
# Provenance is not optional: since 1 May 2026 n8n requires community nodes to be published
# through a CI workflow that attaches one, and an unverified node cannot be installed on n8n
# Cloud at all. Publishing by hand from a laptop produces no provenance and forfeits verification.
#
# Setup, once:
#   1. Create an npm automation token with publish rights on the package.
#   2. Add it to this repository as the secret NPM_TOKEN.
#   3. Push a tag: git tag v0.1.0 && git push origin v0.1.0
name: publish

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read
  id-token: write # required for npm provenance

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org

      # `npm stage` needs npm 11+, and npm 12 itself requires Node >= 22.22 - hence Node 22
      # above rather than 20.
      - run: npm install -g npm@latest

      # --ignore-scripts on purpose. The n8n dev toolchain pulls in `isolated-vm`, a native C++
      # addon, and it fails to compile against the V8 in current Node 20 runners:
      # "PostTaskImpl marked final, but is not virtual". Nothing we ship needs it — it is a
      # transitive devDependency of the CLI, not of the node — so skipping install scripts builds
      # clean. Without this the publish never gets past install.
      - run: npm ci --ignore-scripts

      - run: npm run build

      - run: npm run lint

      # Refuse to publish a package whose version does not match the tag that triggered it.
      # Without this a mistyped tag ships the previous version again, silently.
      - name: version matches the tag
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          PKG="$(node -p "require('./package.json').version")"
          if [ "$TAG" != "$PKG" ]; then
            echo "tag v$TAG does not match package.json version $PKG" >&2
            exit 1
          fi

      # STAGE, do not publish outright.
      #
      # This account's 2FA is a passkey, which produces no 6-digit code, so `npm publish` can never
      # satisfy the `--otp` it asks for. The escape hatch is not a smarter token: npm's own
      # bypass-2FA checkbox on personal granular tokens has been broken since 2025-12 (npm/cli
      # #8869, still open), and npm is retiring bypass tokens for publishing in January 2027 anyway.
      #
      # Staging is the supported path and it splits the act in two: CI stages without any 2FA
      # prompt, then a human approves on npmjs.com (Staged Packages) with their own second factor.
      # Provenance is still signed here, in CI, which is the only place that can sign it.
      - name: stage the release for human approval
        run: npm stage publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: what to do next
        run: |
          echo "Staged. Approve it at https://www.npmjs.com/settings/madiad/staged-packages"
          echo "or run: npm stage approve <stage-id>"
