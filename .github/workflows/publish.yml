# Publishes the package to npm with a provenance statement.
#
# Provenance is not optional: since 1 May 2026 n8n requires community nodes to be published
# through a CI workflow that attaches one, and an unverified node cannot be installed on n8n
# Cloud at all. Publishing by hand from a laptop produces no provenance and forfeits verification.
#
# Setup, once:
#   1. Create an npm automation token with publish rights on the package.
#   2. Add it to this repository as the secret NPM_TOKEN.
#   3. Push a tag: git tag v0.1.0 && git push origin v0.1.0
name: publish

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read
  id-token: write # required for npm provenance

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          registry-url: https://registry.npmjs.org

      # --ignore-scripts on purpose. The n8n dev toolchain pulls in `isolated-vm`, a native C++
      # addon, and it fails to compile against the V8 in current Node 20 runners:
      # "PostTaskImpl marked final, but is not virtual". Nothing we ship needs it — it is a
      # transitive devDependency of the CLI, not of the node — so skipping install scripts builds
      # clean. Without this the publish never gets past install.
      - run: npm ci --ignore-scripts

      - run: npm run build

      - run: npm run lint

      # Refuse to publish a package whose version does not match the tag that triggered it.
      # Without this a mistyped tag ships the previous version again, silently.
      - name: version matches the tag
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          PKG="$(node -p "require('./package.json').version")"
          if [ "$TAG" != "$PKG" ]; then
            echo "tag v$TAG does not match package.json version $PKG" >&2
            exit 1
          fi

      # DO NOT add an `otp` workflow input here. It was tried on 2026-09-06 and removed the same
      # day, for two independent reasons:
      #
      #   1. It leaks. Actions prints a step's `env:` block when the step STARTS, before the first
      #      line of the script runs, so `::add-mask::` inside the script is always too late. A npm
      #      recovery code was published verbatim into this repo's public run log that way. Anything
      #      secret must arrive as a repository SECRET, which Actions masks on its own and never
      #      echoes.
      #   2. It does not work anyway. npm rejects a recovery code where an OTP is expected, and a
      #      real authenticator code expires long before a human can dispatch a workflow with it.
      #
      # If npm demands 2FA for writes, fix it on the ACCOUNT (turn off "require 2FA for write
      # actions", or move to trusted publishing/OIDC), not by smuggling a code through CI.
      - name: publish
        run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
