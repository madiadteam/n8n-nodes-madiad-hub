# Stage a release to npm for human approval.
#
# The publish itself is deliberately split in two: this workflow builds, checks and STAGES the
# tarball, then a maintainer approves it on npmjs.com with their own second factor. That keeps the
# release reproducible (built in CI, provenance signed there) without a long-lived credential that
# can publish on its own.
name: publish

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read
  id-token: write # npm provenance is signed with this

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      # Actions are pinned to a commit SHA, not a moving tag. A tag can be repointed by whoever
      # controls the action's repository, and the very next steps hold a credential that can
      # publish this package - so "actions/checkout@v7" would mean trusting that repository forever.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org

      # Release only from a tag, and only from a tag that is an ancestor of main. Without this a
      # manual dispatch could stage any branch - including one opened to slip code past review -
      # and the human approving on npm has no way to see which ref it came from.
      - name: released ref must be a tag on main
        run: |
          if [ "${GITHUB_REF_TYPE}" != "tag" ]; then
            echo "This workflow releases tags only; got ${GITHUB_REF_TYPE} ${GITHUB_REF_NAME}." >&2
            exit 1
          fi
          git fetch --quiet origin main
          if ! git merge-base --is-ancestor "${GITHUB_SHA}" origin/main; then
            echo "Tag ${GITHUB_REF_NAME} is not on main. Refusing to release it." >&2
            exit 1
          fi

      # The tag must match the version being released, or a mistyped tag silently ships the
      # previous version again.
      - name: tag matches package version
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          PKG="$(node -p "require('./package.json').version")"
          if [ "$TAG" != "$PKG" ]; then
            echo "tag v$TAG does not match package.json version $PKG" >&2
            exit 1
          fi

      # Pinned, like the actions above: `npm@latest` is a moving target that runs with the token in
      # scope. --ignore-scripts because the n8n dev toolchain pulls in a native addon we never use
      # and which does not build on current runners.
      - run: npm install -g npm@12.0.2

      - run: npm ci --ignore-scripts

      - run: npm run build

      - run: npm run lint

      - run: npm test

      # Check the artifact that will actually be published, not just the sources it was built from.
      - name: inspect the tarball
        run: npm pack --dry-run

      # STAGE, do not publish outright: staging needs no second factor and so runs unattended,
      # while the release only becomes public after a maintainer approves it on npmjs.com.
      #
      # DO NOT add a workflow input for a one-time password. Actions prints a step's `env:` block
      # when the step starts, before the script runs, so a secret arriving as an input is public
      # before `::add-mask::` can hide it. Secrets belong in repository secrets, which are masked.
      - name: stage the release for approval
        run: npm stage publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - run: echo "Staged. Approve it under Staged Packages on npmjs.com."
